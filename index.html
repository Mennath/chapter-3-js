<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!--  FORM  -->
    <div class="container">
        <div class="task-form">
            <h1>Add New Task</h1>
            <div class="mb-4">
                <label for="taskName" class="form-label">
                    Task Name
                </label>
                <!-- javascript -->
                <input type="text" id="taskName" class="form-control" placeholder="Enter task name">
            </div>
            <div class="mb-4">
                <label for="taskDescription" class="form-label">
                    Task Description
                </label>
                <!-- javascript -->
                <textarea id="taskDescription" class="form-control" rows="3" placeholder="Enter task description"></textarea>
            </div>
            <div class="mb-4">
                <label for="count" class="form-label">
                    count 
                </label>
                <!-- javascript -->
                <textarea id="count" class="form-control" rows="3" placeholder="Enter count"></textarea>
            </div>
            
            <button id="addBtn" class="btn btn-primary" onclick="addTask()"> Add  </button>
        </div>
        <!--  FILTER BUTTONS  -->
        <!-- <div class="filter-buttons">
          
            <button class="btn btn-info" onclick="filterTasks('all')">All </button> 
            <button class="btn btn-success" onclick="filterTasks('done')">Done</button>  
            <button class="btn btn-secondary" onclick="filterTasks('created')">Created</button>  
            <button class="btn btn-secondary" onclick="filterTasks('created')">Created</button>  
        </div> -->
        <!--  TABLE  -->
        <div class="table-responsive">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Task Name</th>
                        <th>Task Description</th>
                         <th>Status</th>
                        <th>Count</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="taskTableBody"> 
                    <!-- JavaScript will add tasks here اصافه في  -->
                </tbody>
            </table>
        </div>
    </div>
    <!--  EDIT MODAL  -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Edit Task
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editTaskId">
                    <div class="mb-3">
                        <label class="form-label">
                            Task Name
                        </label>
                        <input type="text" id="editTaskName" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Task Description
                        </label>
                        <textarea id="editTaskDescription" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="updateTask()"> Save Changes</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    <!-- <script src="./js/scripte.js"></script> -->
    <script src="./js/scripte.js"></script>
</body>

</html>
